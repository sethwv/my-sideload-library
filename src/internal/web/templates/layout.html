{{define "layout"}}<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{.CSRFToken}}">
<title>{{.Title}} &middot; {{.SiteName}}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/modal.js"></script>
{{if .TaskPage}}<script src="/static/tasks.js" defer></script>{{end}}
</head>
<body>
<div id="modal-backdrop"></div>
<div class="container">
{{template "content" .}}
</div>
{{template "confirmation_modal" .}}
{{if .BuildVersion}}<footer class="footer"><a class="footer-version" href="{{sourceURL .BuildVersion}}">{{.BuildVersion}}</a> {{formatBuildDate .BuildDate}}</footer>{{end}}
</body>
</html>
{{end}}
