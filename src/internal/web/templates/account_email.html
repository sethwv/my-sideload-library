{{define "content"}}
{{template "topbar" .}}

<!-- <h1>Account</h1> -->
{{template "accounttabs" .}}
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{if .Status}}<p class="muted">{{.Status}}</p>{{end}}

<h2>Email</h2>
<!-- <p class="muted">Used for password-reset and weekly digest emails. Leave blank to remove it.</p> -->
<form method="POST" action="/account/email">
  {{template "csrf_field" .}}
  <label>Email address<br><input type="email" name="email" value="{{.Email}}" placeholder="you@example.com"></label>
  <button type="submit">Save email</button>
</form>

<h2>New-book digest</h2>
<p class="muted">Get a weekly email listing books added to the library.</p>
<form method="POST" action="/account/digest">
  {{template "csrf_field" .}}
  <label><input type="checkbox" name="subscribed" style="width:auto;display:inline" {{if .DigestSubscribed}}checked{{end}}> Email me weekly about new books</label>
  <button type="submit">Save</button>
</form>

{{end}}
