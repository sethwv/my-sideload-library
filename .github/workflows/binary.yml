name: Build Standalone Binaries

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            goos: windows
            goarch: amd64
            extension: .exe
            debian_package: false
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            extension: ""
            debian_package: false
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            extension: ""
            debian_package: false
          - target: linux-amd64
            goos: linux
            goarch: amd64
            extension: ""
            debian_package: true
          - target: linux-arm64
            goos: linux
            goarch: arm64
            extension: ""
            debian_package: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum
      - name: Compute build metadata
        id: metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="$RELEASE_VERSION"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%as)" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.target }}
        working-directory: src
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_DATE: ${{ steps.metadata.outputs.date }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
          DEBIAN_PACKAGE: ${{ matrix.debian_package }}
        run: |
          mkdir -p ../dist
          artifact="../dist/sideload-library_${VERSION}_${GOOS}_${GOARCH}${EXTENSION}"
          if test "$DEBIAN_PACKAGE" = true; then
            package="../dist/package"
            mkdir -p "$package/DEBIAN" "$package/usr/bin"
            artifact="../dist/sideload-library_${VERSION}_${GOOS}_${GOARCH}.deb"
            output="$package/usr/bin/sideload-library"
          else
            output="$artifact"
          fi
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.buildVersion=${VERSION} -X main.buildDate=${BUILD_DATE}" \
            -o "$output" ./cmd/server
          if test "$DEBIAN_PACKAGE" = true; then
            case "$VERSION" in
              [0-9]*) package_version="$VERSION" ;;
              *) package_version="0~$VERSION" ;;
            esac
            printf '%s\n' \
              'Package: sideload-library' \
              "Version: ${package_version}" \
              "Architecture: ${GOARCH}" \
              'Maintainer: Seth WV <sethwv@users.noreply.github.com>' \
              'Description: Self-hosted EPUB library for e-readers' \
              > "$package/DEBIAN/control"
            dpkg-deb --root-owner-group --build "$package" "$artifact"
            rm -rf "$package"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: standalone-binary-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
