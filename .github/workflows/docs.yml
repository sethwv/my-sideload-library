name: Deploy documentation

on:
  push:
    branches: [main, "dev/**"]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "src/internal/**"
      - "scripts/docs/**"
      - "scripts/screenshots/**"
  workflow_dispatch:
    inputs:
      regenerate_all_versions:
        description: Rebuild every released documentation version from its tag
        required: true
        default: false
        type: boolean
      docs_retention_mode:
        description: Versioned documentation retention policy
        required: true
        default: minor
        type: choice
        options: [minor, major]
  workflow_call:
    inputs:
      publish_latest:
        required: false
        default: false
        type: boolean
      regenerate_all_versions:
        required: false
        default: false
        type: boolean
      docs_retention_mode:
        required: false
        default: minor
        type: string

permissions:
  contents: write

concurrency:
  group: documentation-publish
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      manifest: ${{ steps.versions.outputs.manifest }}
      latest: ${{ steps.versions.outputs.latest }}
      retained: ${{ steps.versions.outputs.retained }}
      branches: ${{ steps.versions.outputs.branches }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: versions
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_LATEST: ${{ inputs.publish_latest || 'false' }}
          REGENERATE_ALL: ${{ inputs.regenerate_all_versions || 'false' }}
          RETENTION_MODE: ${{ inputs.docs_retention_mode || 'minor' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { execFileSync } from "node:child_process";
          const { branchArtifactSlug, documentationBranches, documentationBranchPrefix, eligibleDocumentationVersions, retainedVersions } = await import("./scripts/docs/version-retention.mjs");
          const allTags = execFileSync("git", ["tag", "-l", "v*", "--sort=-v:refname"], { encoding: "utf8" })
            .trim().split("\n").filter((tag) => /^v\d+\.\d+\.\d+$/.test(tag));
          const tags = eligibleDocumentationVersions(allTags);
          const latest = tags[0] ?? "";
          const retained = retainedVersions(tags, process.env.RETENTION_MODE);
          const branchRefs = documentationBranches(execFileSync("git", ["ls-remote", "--heads", "origin", "dev/*"], { encoding: "utf8" }).trim().split("\n").filter(Boolean));
          const releaseEntries = retained.map((ref) => ({ ref, slug: `tag-${ref}`, sitePath: `tag/${ref}`, label: ref, category: "release" }));
          const allBranchEntries = branchRefs.map((ref) => {
            const suffix = ref.slice(documentationBranchPrefix.length);
            return { ref, slug: branchArtifactSlug(ref), sitePath: `branch/${suffix}`, label: ref, category: "doc-branch" };
          });
          const mainEntry = { ref: "main", slug: "main", sitePath: "branch/main", label: "Development (main)", category: "development" };
          const latestEntry = latest ? { slug: "latest", sitePath: "", label: `Latest (${latest})`, category: "latest" } : null;
          const presentationPaths = [
            ".github/workflows/docs.yml",
            "docs/_config.yml",
            "docs/_includes/head_custom.html",
            "docs/assets/brand/",
            "docs/assets/css/",
            "docs/assets/js/",
            "scripts/docs/",
            "CHANGELOG.md",
          ];
          const capturePaths = ["src/internal/", "scripts/screenshots/", "docs/_data/screenshots.yml"];
          const shouldCompare = process.env.EVENT_NAME === "push" && process.env.BEFORE && !/^0+$/.test(process.env.BEFORE) && process.env.AFTER;
          let comparisonUnavailable = false;
          let changedPaths = [];
          if (shouldCompare) {
            try {
              changedPaths = execFileSync("git", ["diff", "--name-only", process.env.BEFORE, process.env.AFTER], { encoding: "utf8" }).trim().split("\n").filter(Boolean);
            } catch {
              comparisonUnavailable = true;
            }
          }
          const presentationChanged = comparisonUnavailable || changedPaths.some((path) => presentationPaths.some((prefix) => path === prefix || path.startsWith(prefix)));
          const captureChanged = comparisonUnavailable || changedPaths.some((path) => capturePaths.some((prefix) => path === prefix || path.startsWith(prefix)));
          let hasPublishedSite = false;
          try {
            execFileSync("git", ["fetch", "--no-tags", "origin", "docs:refs/remotes/origin/docs"], { stdio: "ignore" });
            hasPublishedSite = true;
          } catch {}
          const activeBranch = process.env.EVENT_NAME === "push" && process.env.REF_NAME.startsWith(documentationBranchPrefix)
            ? allBranchEntries.find(({ ref }) => ref === process.env.REF_NAME)
            : null;
          const branchEntries = hasPublishedSite
            ? allBranchEntries.filter((entry) => entry === activeBranch || hasPublishedPreview(entry))
            : allBranchEntries;
          const allVersions = [...releaseEntries, ...branchEntries, mainEntry];
          const selected = activeBranch
            ? [...(latest ? [releaseEntries.find(({ ref }) => ref === latest)] : []), activeBranch, mainEntry]
            : process.env.REGENERATE_ALL === "true" || presentationChanged
              ? allVersions
              : process.env.PUBLISH_LATEST === "true" && latest ? [releaseEntries.find(({ ref }) => ref === latest), mainEntry] : [mainEntry];
          const capture = process.env.REGENERATE_ALL === "true" || process.env.PUBLISH_LATEST === "true" || presentationChanged || captureChanged || Boolean(activeBranch) || !hasPublishedSite;
          const entries = [...new Map(selected.filter(Boolean).map((entry) => [entry.slug, entry])).values()].map((entry) => ({ ...entry, capture }));
          const manifest = [
            ...(latestEntry ? [{ ...latestEntry, path: latestEntry.sitePath }] : []),
            ...releaseEntries.map(({ sitePath, ...entry }) => ({ ...entry, path: sitePath })),
            ...branchEntries.map(({ sitePath, ...entry }) => ({ ...entry, path: sitePath })),
            { ...mainEntry, path: mainEntry.sitePath },
          ];
          process.stdout.write(`matrix=${JSON.stringify({ include: entries })}\n`);
          process.stdout.write(`manifest=${JSON.stringify(manifest)}\n`);
          process.stdout.write(`latest=${latest}\n`);
          process.stdout.write(`retained=${retained.join(",")}\n`);
          process.stdout.write(`branches=${[...branchEntries.map(({ sitePath }) => sitePath.slice("branch/".length)), "main"].join(",")}\n`);

          function hasPublishedPreview({ sitePath }) {
            try {
              execFileSync("git", ["cat-file", "-e", `refs/remotes/origin/docs:${sitePath}/index.html`], { stdio: "ignore" });
              return true;
            } catch {
              return false;
            }
          }
          NODE

  build:
    needs: discover
    # A historical tag or preview branch can have documentation that no longer
    # builds with current shared tooling. Keep its last published site intact.
    continue-on-error: ${{ matrix.category != 'development' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out shared docs tooling
        uses: actions/checkout@v7
        with:
          path: tooling
      - name: Check out documentation version
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          path: version
      - name: Check out published screenshots
        if: matrix.capture == false
        uses: actions/checkout@v7
        with:
          ref: docs
          path: published
      - name: Restore published screenshots
        if: matrix.capture == false
        run: >-
          test -d "published/${{ matrix.sitePath }}/assets/images/generated"
          && rsync -a --delete
          "published/${{ matrix.sitePath }}/assets/images/generated/"
          "version/docs/assets/images/generated/"
      - if: matrix.capture
        uses: actions/setup-go@v7
        with:
          go-version-file: version/src/go.mod
          cache-dependency-path: version/src/go.sum
      - if: matrix.capture
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tooling/scripts/screenshots/package-lock.json
      - if: matrix.capture
        run: npm ci --prefix version/scripts/screenshots
      - if: matrix.capture
        run: npm ci --prefix tooling/scripts/screenshots
      - id: playwright-cache
        if: matrix.capture
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tooling/scripts/screenshots/package-lock.json') }}
      - if: matrix.capture && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --prefix tooling/scripts/screenshots playwright install --with-deps chromium
      - if: matrix.capture && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx --prefix tooling/scripts/screenshots playwright install chromium
      - if: matrix.capture
        run: npm run fixtures --prefix version/scripts/screenshots -- --output "$RUNNER_TEMP/library"
      - id: build-info
        if: matrix.capture
        run: |
          tag=$(git -C version describe --exact-match --tags --match 'v[0-9]*' HEAD 2>/dev/null || true)
          if test -n "$tag"; then
            version="$tag"
          else
            branch=$(git -C version branch --show-current)
            branch=${branch:-detached}
            version="${branch//\//-}-$(git -C version rev-parse --short HEAD)"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'date=%s\n' "$(git -C version log -1 --format=%as)" >> "$GITHUB_OUTPUT"
      - id: capture-plan
        if: matrix.capture
        run: |
          first_run=$(node --input-type=module <<'NODE'
          import { loadCaptureSpec } from "./tooling/scripts/screenshots/capture-compat.mjs";
          const spec = await loadCaptureSpec("./version", process.env.BUILD_TAG);
          process.stdout.write(spec.scenarios.some((scenario) => scenario.id === "first-admin-setup") ? "true" : "false");
          NODE
          )
          printf 'first_run=%s\n' "$first_run" >> "$GITHUB_OUTPUT"
        env:
          BUILD_TAG: ${{ steps.build-info.outputs.version }}
      - if: matrix.capture
        run: go build -ldflags="-X main.buildVersion=${{ steps.build-info.outputs.version }} -X main.buildDate=${{ steps.build-info.outputs.date }}" -o "$RUNNER_TEMP/server" ./cmd/server
        working-directory: version/src
      - if: matrix.capture
        run: go build -o "$RUNNER_TEMP/fixture-admin" ./cmd/server
        working-directory: tooling/src
      - name: Start first-run fixture server
        if: matrix.capture && steps.capture-plan.outputs.first_run == 'true'
        run: |
          PORT=8080 \
          LIBRARY_PATH="$RUNNER_TEMP/library" \
          DATA_DIR="$RUNNER_TEMP/data" \
          SESSION_SECRET=fixture-session-secret-for-documentation-captures \
          SITE_NAME="my-sideload-library" \
          "$RUNNER_TEMP/server" >"$RUNNER_TEMP/server.log" 2>&1 &
          printf '%s' "$!" >"$RUNNER_TEMP/server.pid"
      - name: Wait for first-run fixture server
        if: matrix.capture && steps.capture-plan.outputs.first_run == 'true'
        run: |
          ready=false;
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              ready=true
              break
            fi
            printf 'Waiting for fixture server (%s/30)\n' "$attempt"
            sleep 1
          done;
          if test "$ready" != true; then
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
      - name: Capture first administrator setup
        if: matrix.capture && steps.capture-plan.outputs.first_run == 'true'
        run: npm run capture --prefix tooling/scripts/screenshots
        env:
          SCREENSHOT_ROOT: ${{ github.workspace }}/version
          SCREENSHOT_BUILD_TAG: ${{ steps.build-info.outputs.version }}
          SCREENSHOT_SCENARIOS: first-admin-setup
      - name: Stop first-run fixture server
        if: matrix.capture && steps.capture-plan.outputs.first_run == 'true'
        run: kill "$(cat "$RUNNER_TEMP/server.pid")"
      - name: Seed fixture user
        if: matrix.capture
        run: |
          DATA_DIR="$RUNNER_TEMP/data" "$RUNNER_TEMP/fixture-admin" admin create-user admin password admin
      - name: Start fixture server
        if: matrix.capture
        run: |
          PORT=8080 \
          LIBRARY_PATH="$RUNNER_TEMP/library" \
          DATA_DIR="$RUNNER_TEMP/data" \
          LIBRARY_USER=admin \
          LIBRARY_PASS=password \
          SESSION_SECRET=fixture-session-secret-for-documentation-captures \
          SITE_NAME="my-sideload-library" \
          "$RUNNER_TEMP/server" >"$RUNNER_TEMP/server.log" 2>&1 &
      - name: Wait for fixture server
        if: matrix.capture
        run: |
          ready=false;
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              ready=true
              break
            fi
            printf 'Waiting for fixture server (%s/30)\n' "$attempt"
            sleep 1
          done;
          if test "$ready" != true; then
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
      - if: matrix.capture
        run: npm run capture --prefix tooling/scripts/screenshots
        env:
          SCREENSHOT_ROOT: ${{ github.workspace }}/version
          SCREENSHOT_BUILD_TAG: ${{ steps.build-info.outputs.version }}
          SCREENSHOT_EXCLUDE_SCENARIOS: first-admin-setup
      - run: >-
          node tooling/scripts/docs/prepare-source.mjs
          version/docs .docs-source version/CONTRIBUTING.md
          tooling/CHANGELOG.md
          tooling/docs
          "${{ matrix.sitePath }}" "${{ matrix.slug }}" "${{ matrix.ref }}"
          '${{ needs.discover.outputs.manifest }}'
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .docs-source
          destination: _site
      - name: Stage version site
        run: >-
          mkdir -p "artifact/${{ matrix.slug }}"
          && rsync -a --delete _site/ "artifact/${{ matrix.slug }}/"
          && printf '%s' "${{ matrix.sitePath }}" > "artifact/${{ matrix.slug }}/site-path.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site-${{ matrix.slug }}
          path: artifact
      - name: Prepare latest release at the root
        if: matrix.ref == needs.discover.outputs.latest || (needs.discover.outputs.latest == '' && matrix.ref == 'main')
        run: >-
          node tooling/scripts/docs/prepare-source.mjs
          version/docs .docs-root version/CONTRIBUTING.md
          tooling/CHANGELOG.md
          tooling/docs
          "" "${{ needs.discover.outputs.latest || 'main' }}" "${{ matrix.ref }}"
          '${{ needs.discover.outputs.manifest }}'
      - name: Build latest release at the root
        if: matrix.ref == needs.discover.outputs.latest || (needs.discover.outputs.latest == '' && matrix.ref == 'main')
        uses: actions/jekyll-build-pages@v1
        with:
          source: .docs-root
          destination: _site-root
      - name: Stage latest release root site
        if: matrix.ref == needs.discover.outputs.latest || (needs.discover.outputs.latest == '' && matrix.ref == 'main')
        run: >-
          mkdir -p root-artifact/root
          && rsync -a --delete _site-root/ root-artifact/root/
      - name: Upload latest release root site
        if: matrix.ref == needs.discover.outputs.latest || (needs.discover.outputs.latest == '' && matrix.ref == 'main')
        uses: actions/upload-artifact@v4
        with:
          name: docs-root
          path: root-artifact
      - name: Record version build status
        if: always()
        env:
          REF: ${{ matrix.ref }}
          SLUG: ${{ matrix.slug }}
          CATEGORY: ${{ matrix.category }}
          STATUS: ${{ job.status }}
        run: >-
          node --input-type=module -e
          'import { mkdir, writeFile } from "node:fs/promises";
          await mkdir("status", { recursive: true });
          await writeFile("status/build-status.json", JSON.stringify({ ref: process.env.REF, slug: process.env.SLUG, category: process.env.CATEGORY, status: process.env.STATUS }));'
      - name: Upload version build status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-status-${{ matrix.slug }}
          path: status

  publish:
    needs: [discover, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out docs configuration
        uses: actions/checkout@v7
        with:
          path: tooling
      - name: Restore previous documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          git clone --depth 1 --branch docs
          "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" previous-docs
          || true
      - uses: actions/download-artifact@v5
        with:
          pattern: docs-site-*
          path: incoming
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: docs-status-*
          path: statuses
      - name: Assemble published sites
        env:
          REGENERATE_ALL: ${{ inputs.regenerate_all_versions || 'false' }}
          LATEST: ${{ needs.discover.outputs.latest }}
          RETAINED: ${{ needs.discover.outputs.retained }}
          BRANCHES: ${{ needs.discover.outputs.branches }}
        run: |
          mkdir publish
          if test "$REGENERATE_ALL" != "true" && test -d previous-docs; then rsync -a --exclude=.git previous-docs/ publish/; fi
          node --input-type=module <<'NODE'
           import { prunePublishedSites } from './tooling/scripts/docs/version-retention.mjs';
           await prunePublishedSites('publish', process.env.RETAINED.split(',').filter(Boolean), process.env.BRANCHES.split(',').filter(Boolean));
          NODE
          for artifact in incoming/*; do
            slug="${artifact##*/}"
            if test "$slug" = root; then continue; fi
             site_path=$(cat "$artifact/site-path.txt")
             case "$site_path" in ''|/*|*'..'*) exit 1 ;; esac
             rm -rf "publish/$site_path"
             mkdir -p "publish/$site_path"
             rsync -a --delete --exclude=site-path.txt "$artifact/" "publish/$site_path/"
             test -f "publish/$site_path/index.html"
          done
          if test -d incoming/root; then
            for entry in publish/* publish/.[!.]*; do
              test -e "$entry" || continue
               case "${entry##*/}" in tag|branch|main) continue ;; esac
              rm -rf "$entry"
            done
            rsync -a "incoming/root/" publish/
            test -f publish/index.html
          fi
          cp tooling/docs/CNAME publish/CNAME
          touch publish/.nojekyll
          node --input-type=module <<'NODE'
          import { appendFile, readdir, readFile } from 'node:fs/promises';
          import path from 'node:path';
          const entries = await readdir('statuses', { recursive: true });
          const reports = await Promise.all(entries.filter((entry) => entry.endsWith('build-status.json')).map(async (entry) => JSON.parse(await readFile(path.join('statuses', entry), 'utf8'))));
          const failed = reports.filter(({ status }) => status !== 'success');
          if (failed.length) {
            const summary = ['## Documentation versions retained', '', 'The following version builds failed. Their previously published documentation was retained:', '', ...failed.map(({ ref, category }) => `- \`${ref}\` (${category})`), ''].join('\n');
            await appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
          }
          NODE
      - name: Publish complete documentation tree
        working-directory: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init
          git checkout -b docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "docs: publish versioned documentation"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin docs
