name: Create Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Type of version increment
        required: true
        default: patch
        type: choice
        options: [major, minor, patch]

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require main
        run: test "$GITHUB_REF_NAME" = main
      - name: Compute version bump
        id: bump
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "${{ inputs.version_type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

  docker:
    needs: version
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  binaries:
    needs: version
    uses: ./.github/workflows/binary.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, docker, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag and push
        run: |
          git tag "v${{ needs.version.outputs.version }}"
          git push origin main --tags
      - name: Download standalone binaries
        uses: actions/download-artifact@v7
        with:
          pattern: standalone-binary-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "v${{ needs.version.outputs.version }}"
          dist/*
          --generate-notes
          --title "v${{ needs.version.outputs.version }}"

  docs:
    needs: release
    uses: ./.github/workflows/docs.yml
    with:
      publish_latest: true
      regenerate_all_versions: false
    permissions:
      contents: write
